<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Cinema Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 850px; }
        
        /* Video Player Styling */
        .player-wrapper {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-color);
            padding-bottom: 10px;
        }
        video {
            width: 100%;
            max-height: 45vh;
            background: #000;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            outline: none;
        }
        .now-playing {
            font-size: 0.9rem;
            color: var(--accent);
            margin-top: 8px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Dashboard Header */
        h1 { font-size: 1.4rem; margin: 10px 0 2px 0; color: var(--accent); }
        p.subtitle { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 16px; }

        /* Main Tabs / Category Buttons */
        .main-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .tab-btn {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 12px 8px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--accent-hover);
            border-color: var(--accent);
        }

        /* Content Sections */
        .section-content { display: none; }
        .section-content.active { display: block; }

        /* Accordion / Sub-category styling */
        .sub-group {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
        }
        .sub-header {
            padding: 14px 16px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.02);
        }
        .sub-header:hover { background: rgba(255,255,255,0.05); }
        .sub-body {
            padding: 8px 12px;
            display: none;
            border-top: 1px solid var(--card-border);
            flex-direction: column;
            gap: 6px;
        }
        .sub-group.open .sub-body { display: flex; }
        .sub-group.open .arrow { transform: rotate(90deg); }
        .arrow { transition: transform 0.2s; font-size: 0.8rem; color: var(--text-sub); }

        /* Item Selection Buttons */
        .media-btn {
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 12px 14px;
            text-align: left;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .media-btn:active, .media-btn:hover {
            background: var(--accent-hover);
            border-color: var(--accent);
        }
    </style>
</head>

<script>
    // Switch between Main Tabs (Movies, TV, Music)
    function switchCategory(categoryId, btnElement) {
        document.querySelectorAll('.section-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(categoryId).classList.add('active');
        btnElement.classList.add('active');
    }

    // Toggle TV Show / Artist Accordion Dropdowns
    function toggleSub(headerElement) {
        const group = headerElement.parentElement;
        group.classList.toggle('open');
    }

    // Play Selected Video
    function playMedia(videoUrl, title) {
        const player = document.getElementById('videoPlayer');
        const textLabel = document.getElementById('nowPlayingText');
        
        player.src = videoUrl;
        player.load();
        player.play().catch(error => {
            console.log("Autoplay restriction prevented auto-start:", error);
        });

        textLabel.textContent = "▶ Now Playing: " + title;
        
        // Smooth scroll back to top player on mobile when a video is tapped
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
